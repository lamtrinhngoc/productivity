name: productivity

on:
  schedule:
    # Every hour from 07:00 to 19:00 Vietnam time (cron is in UTC: 00:00–12:00 UTC)
    - cron: '0 0-12 * * *'
  workflow_dispatch:  # Allows manual run (any time)

jobs:
  aggregate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo content
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade gspread oauth2client "pandas<3" google-auth tenacity

    - name: Write Google credentials to file
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
      run: |
        echo "$GOOGLE_APPLICATION_CREDENTIALS" > credentials.json

    - name: Set environment variables
      env:
        LINK: ${{ secrets.LINK }}
        MASTER: ${{ secrets.MASTER }}
      run: |
        echo "$LINK" > link
        echo "$MASTER" > master

    - name: Run productivity script
      run: |
        python new_productivity.py

    - name: Run nationwide script
      run: |
        python "extract-productivity.py"

    - name: Run master input
      run: |
        python "productivity.py"
