name: productivity

on:
  schedule:
    - cron: '0 * * * *'  # Runs every 30 minutes
  workflow_dispatch:  # Allows manual run

jobs:
  aggregate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo content
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade gspread oauth2client pandas google-auth tenacity

    - name: Write Google credentials to file
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
      run: |
        echo "$GOOGLE_APPLICATION_CREDENTIALS" > credentials.json

    - name: Set environment variables
      env:
        LINK: ${{ secrets.LINK }}
        MASTER: ${{ secrets.MASTER }}
      run: |
        echo "$LINK" > link
        echo "$MASTER" > master

    - name: Check current time
      run: |
        current_hour=$(date +"%H")
        if [ $current_hour -ge 20 ] || [ $current_hour -lt 7 ]; then
          echo "Current time is outside the allowed range. Exiting."
          exit 0
        fi

    - name: Run productivity script
      run: |
        python new_productivity.py

    - name: Run nationwide script
      run: |
        python "extract-productivity.py"
        
    - name: Run master input
      run: |
        python "productivity.py"
